name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci
      - run: npm run lint
      - run: npm run lint:l10n
      - run: npm run test:compile
      - run: npm run package

      # Pre-release tags carry an alpha/beta/rc/pre/canary/next/dev suffix.
      - name: Determine pre-release flag
        id: prerelease
        run: |
          if [[ "${GITHUB_REF_NAME}" == *"-alpha"* || "${GITHUB_REF_NAME}" == *"-beta"* || "${GITHUB_REF_NAME}" == *"-rc"* || "${GITHUB_REF_NAME}" == *"-pre"* || "${GITHUB_REF_NAME}" == *"-canary"* || "${GITHUB_REF_NAME}" == *"-next"* || "${GITHUB_REF_NAME}" == *"-dev"* ]]; then
            echo "flag=--pre-release" >> "$GITHUB_OUTPUT"
          else
            echo "flag=" >> "$GITHUB_OUTPUT"
          fi

      - name: Package VSIX
        run: npx vsce package ${{ steps.prerelease.outputs.flag }}

      - name: Publish to VS Code Marketplace
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
        run: npx vsce publish ${{ steps.prerelease.outputs.flag }}

      - name: Ensure Open VSX namespace exists
        run: npx ovsx create-namespace ameyypawar -p "$OVSX_PAT" || true
        env:
          OVSX_PAT: ${{ secrets.OVSX_PAT }}

      - name: Publish to Open VSX
        env:
          OVSX_PAT: ${{ secrets.OVSX_PAT }}
        run: npx ovsx publish ${{ steps.prerelease.outputs.flag }}

      - name: Attach VSIX to GitHub release
        uses: softprops/action-gh-release@b4309332981a82ec1c5618f44dd2e27cc8bfbfda # v3.0.0
        with:
          files: '*.vsix'
          prerelease: ${{ contains(github.ref_name, '-alpha') || contains(github.ref_name, '-beta') || contains(github.ref_name, '-rc') || contains(github.ref_name, '-pre') || contains(github.ref_name, '-canary') || contains(github.ref_name, '-next') || contains(github.ref_name, '-dev') }}
