name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-14, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci
      - run: npm run lint
      - run: npm run lint:l10n
      - run: npm run package
      - run: npm run test:compile
      - name: Test (Linux)
        if: matrix.os == 'ubuntu-latest'
        run: xvfb-run -a npm test
        env:
          DISPLAY: ':99.0'
      - name: Test (macOS/Windows)
        if: matrix.os != 'ubuntu-latest'
        run: npm test

  integration:
    runs-on: ubuntu-latest
    env:
      GFIX_VERSION: v0.1.0-alpha.4
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '20'
          cache: 'npm'
      - name: Install gfix
        run: |
          gh release download "$GFIX_VERSION" --repo ameyypawar/gfix --pattern '*x86_64-unknown-linux-gnu.tar.gz' --output gfix.tar.gz
          tar -xzf gfix.tar.gz
          sudo mv gfix /usr/local/bin/
          gfix --version
        env:
          GH_TOKEN: ${{ github.token }}
      - run: npm ci && npm run compile && npm run test:compile
      - run: xvfb-run -a npm run test:integration
        env:
          DISPLAY: ':99.0'
