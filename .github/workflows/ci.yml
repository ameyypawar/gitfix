name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci
      - run: npm run lint
      - run: npm run package
      - run: npm run test:compile
      # Headless extension tests need xvfb on Linux.
      - run: xvfb-run -a npm test
        env:
          DISPLAY: ':99.0'
