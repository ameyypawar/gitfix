name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci
      - run: npm run lint
      - run: npm run package
      - run: npm run test:compile
      # Headless extension tests need xvfb on Linux.
      - run: xvfb-run -a npm test
        env:
          DISPLAY: ':99.0'

  integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - name: Install gfix
        run: |
          gh release download --repo ameyypawar/gitfix --pattern '*-linux-x64.tar.gz' --output gfix.tar.gz
          tar -xzf gfix.tar.gz
          sudo mv gfix /usr/local/bin/
        env:
          GH_TOKEN: ${{ github.token }}
      - run: npm ci && npm run compile
      - run: xvfb-run -a npm run test:integration
        env:
          DISPLAY: ':99.0'
